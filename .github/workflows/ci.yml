name: CI

# beta is the integration branch feature work merges into, so it needs CI as much as
# main does. Triggering only on main meant every merge into beta landed unvalidated and
# the first real signal arrived whenever beta was eventually promoted -- by which point
# the breaking change is buried among everything else that merged since.
on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

# The job only reads the checkout and runs bash -- it never uses the token after
# actions/checkout, so the default write scopes are unnecessary.
permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The two self-check suites run as their own steps, not only through the aggregator.
      # Both are themselves manifest rows, so deleting their two rows removed both from the
      # run while every other gate stayed green. A guard registered only in the artifact it
      # guards cannot enforce its own registration.
      - name: Suite manifest guard
        run: bash tests/validate-suite-manifest.sh

      - name: Runner guard
        run: bash tests/runner-guard.sh

      - name: Validate skill structure
        run: bash tests/validate-skills.sh

      # Regression guard for the aggregator itself: a `set -e`-unsafe construct in
      # run-all.sh aborts the run before it prints "Total:", failing this step.
      # The live-LLM suite is skipped -- it needs the claude CLI and credentials.
      #
      # The count assertion exists because a shrinking run is what every bypass of this
      # harness produced: fewer suites executed, still exit 0. EXPECTED is derived from the
      # manifest rather than from run-all.sh, so a runner that stopped reading the manifest
      # cannot also lower the bar it is measured against.
      - name: Run aggregated test suite
        env:
          SKIP_LIVE_TESTS: "1"
        run: |
          set -o pipefail
          EXPECTED=$(grep -cE '^[[:space:]]*[^#[:space:]]' tests/required-suites.txt)
          echo "Manifest declares $EXPECTED suites."
          bash tests/run-all.sh | tee run.log
          grep -q "Total: $EXPECTED suites passed, 0 suites failed" run.log \
            || { echo "ERROR: expected all $EXPECTED declared suites to pass"; exit 1; }

      - name: Check version consistency
        run: |
          VERSIONS=$(grep -hoE '"version": "[^"]+"' \
            package.json \
            .claude-plugin/plugin.json \
            .cursor-plugin/plugin.json \
            gemini-extension.json \
            | sort -u)
          if [ -z "$VERSIONS" ]; then
            echo "ERROR: No version strings found in config files"
            exit 1
          fi
          COUNT=$(echo "$VERSIONS" | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Version mismatch across config files:"
            echo "$VERSIONS"
            exit 1
          fi
          echo "All config files at $(echo "$VERSIONS" | head -1)"
