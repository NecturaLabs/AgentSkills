name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pull requests share one group per ref, so pushing twice in a minute cancels the run that
# validated a tree nobody will merge. Pushes get a group of their own keyed by run id: joining a
# shared group cancels an already-pending run whatever cancel-in-progress says, which would leave
# the middle commit of three quick pushes permanently unvalidated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinned to a commit rather than the mutable v7 tag, per NIST SSDF and OpenSSF Scorecard: a
      # tag can be repointed at any commit after review. Bump the SHA and its comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Run directly as well as through the aggregator. The guard is what proves the validator can
      # fail at all, and a gate registered only inside the artifact it guards cannot enforce its
      # own registration.
      - name: Validator guard
        run: bash tests/validator-guard.sh

      - name: Validate structure
        run: bash scripts/validate.sh --strict

      # The count assertion exists because every bypass of a harness like this produced the same
      # shape: fewer suites executed, still exit 0. EXPECTED is counted from run-all.sh's own
      # run_suite calls, so adding a suite raises the bar automatically while a runner that skips
      # one still fails -- without a separate manifest file that can drift out of agreement.
      - name: Aggregated suite
        run: |
          set -o pipefail
          EXPECTED=$(grep -cE '^[[:space:]]*run_suite ' tests/run-all.sh)
          echo "Runner declares $EXPECTED suites."
          [ "$EXPECTED" -ge 2 ] || { echo "ERROR: expected at least 2 suites, found $EXPECTED"; exit 1; }
          bash tests/run-all.sh | tee run.log
          # Only the aggregator's closing block, never the whole log: run-all.sh echoes each
          # suite's stdout into it, so a whole-log grep was satisfied by any single suite printing
          # the expected Total line.
          ACTUAL=$(tail -3 run.log | grep -E '^Total: ' | tail -1 || true)
          case "$ACTUAL" in
            "Total: $EXPECTED suites passed, 0 suites failed"*) ;;
            *) echo "ERROR: expected all $EXPECTED declared suites to pass, got: $ACTUAL"; exit 1 ;;
          esac

      # scripts/validate.sh also checks this, but a shell syntax error there would skip the check
      # silently while still failing for the wrong reason. Two lines here cost nothing.
      - name: Version consistency
        run: |
          for f in package.json .claude-plugin/plugin.json; do
            [ -f "$f" ] || { echo "ERROR: $f is missing"; exit 1; }
          done
          VERSIONS=$(grep -hoE '"version": "[^"]+"' package.json .claude-plugin/plugin.json | sort -u)
          COUNT=$(printf '%s\n' "$VERSIONS" | grep -c .)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: version mismatch across manifests:"
            printf '%s\n' "$VERSIONS"
            exit 1
          fi
          echo "All manifests at $(printf '%s\n' "$VERSIONS" | head -1)"

  fab:
    name: Fab CLI (${{ matrix.os }})
    # GitHub-hosted runners only: this workflow runs on pull_request, so it must never reach a
    # self-hosted runner.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli/fab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: cli/fab
      - run: sh ../../scripts/check-version.sh
        shell: bash
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  fab-msrv:
    name: Fab CLI minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli/fab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.85"
      - run: cargo check --all-targets --locked

  fab-installer:
    name: Fab installer round trip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.98"
      # FabCLI links WebKitGTK for its sign-in window, even to print its version.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libsoup-3.0-0
      - run: sh scripts/test-fab-installer.sh
