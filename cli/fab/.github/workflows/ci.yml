name: CI

# Runs only on NecturaLabs self-hosted runners, so it must never run code from
# an untrusted branch. For `pull_request` events GitHub executes the workflow
# file from the pull request itself, so no condition written in this file can
# keep a fork's code off the runners. There is therefore no `pull_request`
# trigger: pushes to main (which already passed review) and manual dispatch
# only. The runner group must additionally be restricted to this workflow file
# on refs/heads/main (docs/security.md, "CI").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      # Actions are pinned to commits, not mutable tags. Bump the SHA and its comment together.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # Self-hosted runners share one OS user, so parallel jobs would race on a shared ~/.rustup.
      # Each runner gets its own Rust home in its tool cache instead.
      - name: Per-runner Rust home
        shell: bash
        run: |
          echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          echo "$RUNNER_TOOL_CACHE/cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: sh scripts/check-version.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # Self-hosted runners share one OS user, so parallel jobs would race on a shared ~/.rustup.
      # Each runner gets its own Rust home in its tool cache instead.
      - name: Per-runner Rust home
        shell: bash
        run: |
          echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          echo "$RUNNER_TOOL_CACHE/cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.85"
      - run: cargo check --all-targets --locked

  installer:
    name: Installer round trip
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      # Self-hosted runners share one OS user, so parallel jobs would race on a shared ~/.rustup.
      # Each runner gets its own Rust home in its tool cache instead.
      - name: Per-runner Rust home
        shell: bash
        run: |
          echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          echo "$RUNNER_TOOL_CACHE/cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.98"
      - run: sh scripts/test-installer.sh
